name: Inspect iOS EAS Prebuild Failure

on:
  pull_request:
    branches:
      - integration/mobile-event-editor-aligned-20260809
    paths:
      - ".github/workflows/tmp-eas-release-inspect.yml"

permissions:
  contents: read

jobs:
  inspect-ios:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Inspect failed iOS EAS build
        shell: bash
        run: |
          npx eas-cli@latest build:view aede49fc-0c00-4741-a103-5c2c8f08dfeb --json > ../failed-ios-build.json
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('../failed-ios-build.json','utf8'));
          const url=(d.logFiles||[])[0];
          if (!url) process.exit(3);
          fs.writeFileSync('../failed-ios-log-url.txt',url);
          NODE
          curl --compressed -fsSL "$(cat ../failed-ios-log-url.txt)" -o ../failed-ios-log.txt
          echo '--- iOS prebuild failure ---'
          strings ../failed-ios-log.txt | tail -n 260
