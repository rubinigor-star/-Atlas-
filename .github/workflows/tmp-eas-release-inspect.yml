name: Build Atlas iOS 0.1.7 TestFlight

on:
  pull_request:
    branches:
      - integration/mobile-event-editor-aligned-20260809
    paths:
      - ".github/workflows/tmp-eas-release-inspect.yml"
      - "mobile/app.json"
      - "mobile/assets/atlas-one-app-icon.png"

permissions:
  contents: read

jobs:
  ios-release:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Expo token
        run: |
          test -n "$EXPO_TOKEN"
          echo "EXPO_TOKEN is configured"

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Generate and validate clean app icon
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          cat > /tmp/atlas-icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <rect width="1024" height="1024" fill="#ffffff"/>
            <path fill="#ff8200" d="M281 767 L433 300 Q439 282 459 282 H565 Q587 282 594 302 L744 767 Q751 790 729 790 H666 Q650 790 645 775 L616 684 H420 L390 776 Q385 790 367 790 H296 Q274 790 281 767 Z M469 573 H569 L519 426 Z"/>
            <path fill="#0b4775" d="M282 785 L497 654 Q512 645 520 658 L492 765 Q486 786 462 786 Z"/>
          </svg>
          SVG
          convert -background white /tmp/atlas-icon.svg -resize 1024x1024! -alpha off -strip PNG24:assets/atlas-one-app-icon.png
          file assets/atlas-one-app-icon.png
          identify assets/atlas-one-app-icon.png
          node - <<'NODE'
          const Jimp = require('jimp-compact');
          Jimp.read('assets/atlas-one-app-icon.png')
            .then(img => {
              if (img.bitmap.width !== 1024 || img.bitmap.height !== 1024) {
                throw new Error(`Expected 1024x1024 icon, got ${img.bitmap.width}x${img.bitmap.height}`);
              }
              console.log(`Jimp decoded icon: ${img.bitmap.width}x${img.bitmap.height}`);
            })
            .catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Set iOS export compliance flag
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'app.json';
          const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
          cfg.expo.ios = cfg.expo.ios || {};
          cfg.expo.ios.infoPlist = {
            ...(cfg.expo.ios.infoPlist || {}),
            ITSAppUsesNonExemptEncryption: false,
          };
          fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + '\n');
          NODE

      - name: Verify EAS project and app config
        run: |
          npx eas-cli@latest project:info
          npx expo config --type public > /dev/null
          npx expo-doctor
          npm run typecheck

      - name: Build iOS production
        shell: bash
        run: |
          npx eas-cli@latest build --platform ios --profile production --non-interactive --wait --json | tee ../ios-build.json

      - name: Submit iOS to TestFlight
        shell: bash
        run: |
          IOS_BUILD_ID=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('../ios-build.json','utf8'));const b=Array.isArray(d)?d[0]:d;process.stdout.write(b.id||'')")
          test -n "$IOS_BUILD_ID"
          echo "Submitting EAS build $IOS_BUILD_ID to TestFlight"
          npx eas-cli@latest submit --platform ios --id "$IOS_BUILD_ID" --non-interactive --wait

      - name: Publish iOS release info
        if: always()
        shell: bash
        working-directory: .
        run: |
          node <<'NODE'
          const fs=require('fs');
          let ios=null;
          if(fs.existsSync('ios-build.json')){const d=JSON.parse(fs.readFileSync('ios-build.json','utf8'));ios=Array.isArray(d)?d[0]:d;}
          const url=ios?.artifacts?.applicationArchiveUrl||ios?.artifacts?.buildUrl||ios?.buildUrl||'';
          const lines=['# Atlas One 0.1.7 iOS release','',`iOS EAS build: ${url||ios?.id||'not completed'}`,'Submission target: TestFlight'];
          fs.writeFileSync('ios-release-info.txt',lines.join('\n')+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          console.log(lines.join('\n'));
          NODE

      - name: Upload iOS release info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-ios-017-release-info
          path: ios-release-info.txt
