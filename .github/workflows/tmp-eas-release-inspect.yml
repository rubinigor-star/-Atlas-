name: Submit Atlas iOS 0.1.7 Build 8 to TestFlight

# Submit the already-finished EAS iOS build. Do not rebuild Android or iOS here.
on:
  pull_request:
    branches:
      - integration/mobile-event-editor-aligned-20260809
    paths:
      - ".github/workflows/tmp-eas-release-inspect.yml"

permissions:
  contents: read

jobs:
  ios-submit:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      IOS_BUILD_ID: 85291fa7-ec7d-4105-8bc8-9190617daa38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Expo project
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest project:info

      - name: Discover and connect App Store Connect app
        shell: bash
        run: |
          set -o pipefail
          npx eas-cli@latest integrations:asc:connect \
            --bundle-id il.co.atlas.office \
            --json 2>&1 | tee ../asc-connect.log

      - name: Configure submit profile from discovered Apple ID
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('../asc-connect.log', 'utf8');
          let obj = null;
          for (const line of text.split(/\r?\n/).reverse()) {
            const t = line.trim();
            if (!t.startsWith('{') && !t.startsWith('[')) continue;
            try { obj = JSON.parse(t); break; } catch {}
          }
          const ids = new Set();
          const walk = v => {
            if (!v) return;
            if (Array.isArray(v)) return v.forEach(walk);
            if (typeof v !== 'object') return;
            for (const [k,val] of Object.entries(v)) {
              if (/^(ascAppId|appleAppId|id)$/i.test(k) && /^\d{6,}$/.test(String(val))) ids.add(String(val));
              walk(val);
            }
          };
          walk(obj);
          for (const re of [/"ascAppId"\s*:\s*"?(\d{6,})"?/g,/"appleAppId"\s*:\s*"?(\d{6,})"?/g,/Apple ID[^0-9]*(\d{6,})/gi]) {
            for (const m of text.matchAll(re)) ids.add(m[1]);
          }
          const candidates = [...ids];
          if (candidates.length !== 1) {
            console.error('Could not determine a unique App Store Connect Apple ID. Candidates:', candidates);
            console.error(text);
            process.exit(1);
          }
          const ascAppId = candidates[0];
          const p = 'eas.json';
          const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
          cfg.submit = cfg.submit || {};
          cfg.submit.production = cfg.submit.production || {};
          cfg.submit.production.ios = { ...(cfg.submit.production.ios || {}), ascAppId };
          fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + '\n');
          console.log(`Configured ascAppId=${ascAppId}`);
          NODE

      - name: Submit existing iOS build to TestFlight
        shell: bash
        run: |
          npx eas-cli@latest submit \
            --platform ios \
            --profile production \
            --id "$IOS_BUILD_ID" \
            --non-interactive \
            --wait \
            --verbose

      - name: Publish result
        if: always()
        shell: bash
        working-directory: .
        run: |
          echo "Atlas One 0.1.7 build 8" >> "$GITHUB_STEP_SUMMARY"
          echo "EAS build: $IOS_BUILD_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: TestFlight" >> "$GITHUB_STEP_SUMMARY"
