name: Build Atlas EAS Release 0.1.7

on:
  pull_request:
    branches:
      - integration/mobile-event-editor-aligned-20260809
    paths:
      - ".github/workflows/tmp-eas-release-inspect.yml"
      - "mobile/app.json"
      - "mobile/assets/atlas-one-app-icon.png"

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is unavailable"
            exit 2
          fi
          echo "EXPO_TOKEN is configured"
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Verify EAS project
        run: npx eas-cli@latest project:info
      - name: Verify Expo config and icon
        run: |
          test -s assets/atlas-one-app-icon.png
          npx expo config --type public > /dev/null
          npx expo-doctor
      - name: TypeScript check
        run: npm run typecheck
      - name: Build Android preview APK
        shell: bash
        run: |
          npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json | tee ../android-build.json
      - name: Build iOS production
        shell: bash
        run: |
          npx eas-cli@latest build --platform ios --profile production --non-interactive --wait --json | tee ../ios-build.json
      - name: Submit iOS to TestFlight
        shell: bash
        run: |
          IOS_BUILD_ID=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('../ios-build.json','utf8'));const b=Array.isArray(d)?d[0]:d;process.stdout.write(b.id||'')")
          if [ -z "$IOS_BUILD_ID" ]; then
            echo "Could not determine iOS EAS build ID"
            exit 3
          fi
          npx eas-cli@latest submit --platform ios --id "$IOS_BUILD_ID" --non-interactive --wait
      - name: Publish release links
        if: always()
        shell: bash
        working-directory: .
        run: |
          node <<'NODE'
          const fs = require('fs');
          const one = (p) => {
            if (!fs.existsSync(p)) return null;
            const d = JSON.parse(fs.readFileSync(p,'utf8'));
            return Array.isArray(d) ? d[0] : d;
          };
          const android = one('android-build.json');
          const ios = one('ios-build.json');
          const androidUrl = android?.artifacts?.applicationArchiveUrl || android?.artifacts?.buildUrl || android?.buildUrl || '';
          const iosUrl = ios?.artifacts?.applicationArchiveUrl || ios?.artifacts?.buildUrl || ios?.buildUrl || '';
          const lines = [
            '# Atlas One 0.1.7 release',
            '',
            `Android APK: ${androidUrl || android?.id || 'not completed'}`,
            `iOS EAS build: ${iosUrl || ios?.id || 'not completed'}`,
            'iOS submission target: TestFlight',
          ];
          fs.writeFileSync('mobile-release-links.txt', lines.join('\n') + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          console.log(lines.join('\n'));
          NODE
      - name: Upload release links
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-mobile-release-017-links
          path: mobile-release-links.txt
