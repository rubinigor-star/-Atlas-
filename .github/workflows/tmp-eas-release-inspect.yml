name: Inspect Atlas EAS Release

on:
  pull_request:
    branches:
      - integration/mobile-event-editor-aligned-20260809
    paths:
      - ".github/workflows/tmp-eas-release-inspect.yml"
      - "mobile/app.json"
      - "mobile/assets/atlas-one-app-icon.png"

permissions:
  contents: read

jobs:
  inspect-eas:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is unavailable"
            exit 2
          fi
          echo "EXPO_TOKEN is configured"
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Verify EAS project
        run: npx eas-cli@latest project:info
      - name: Decode failed Android prebuild log
        shell: bash
        run: |
          npx eas-cli@latest build:view b0c62c40-cb0a-4357-b7ef-6c1cd0e86d8d --json > ../failed-build.json
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('../failed-build.json','utf8'));
          const url=(d.logFiles||[])[0];
          if (!url) process.exit(3);
          fs.writeFileSync('../failed-log-url.txt',url);
          NODE
          curl -fsSL "$(cat ../failed-log-url.txt)" -o ../failed-log.bin
          file ../failed-log.bin
          if gzip -t ../failed-log.bin 2>/dev/null; then
            gzip -dc ../failed-log.bin | tail -n 300
          else
            tail -n 300 ../failed-log.bin
          fi
