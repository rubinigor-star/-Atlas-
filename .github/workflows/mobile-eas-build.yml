name: Atlas Mobile EAS Build

on:
  workflow_dispatch:
  push:
    branches:
      - mobile/app-build-20260818-new-icon
    paths:
      - .github/mobile-build-trigger

permissions:
  contents: read

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EXPO_ACCESS_TOKEN }}
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verify Expo token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Neither EXPO_TOKEN nor EXPO_ACCESS_TOKEN is configured in GitHub Secrets."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo account
        run: npx eas-cli@latest whoami

      - name: Build iOS for TestFlight
        shell: bash
        run: |
          npx eas-cli@latest build --platform ios --profile production --non-interactive --wait --json | tee ../ios-build.json

      - name: Submit iOS build to TestFlight
        shell: bash
        run: |
          IOS_BUILD_ID=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('../ios-build.json','utf8'));const b=Array.isArray(d)?d[0]:d;process.stdout.write(b.id||'')")
          if [ -z "$IOS_BUILD_ID" ]; then
            echo "Could not determine iOS EAS build ID"
            exit 1
          fi
          npx eas-cli@latest submit --platform ios --id "$IOS_BUILD_ID" --non-interactive --wait

      - name: Build Android installable APK
        shell: bash
        run: |
          npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json | tee ../android-build.json

      - name: Publish build links
        shell: bash
        working-directory: .
        run: |
          node <<'NODE'
          const fs = require('fs');
          function one(path) {
            const d = JSON.parse(fs.readFileSync(path, 'utf8'));
            return Array.isArray(d) ? d[0] : d;
          }
          const ios = one('ios-build.json');
          const android = one('android-build.json');
          const androidUrl = android?.artifacts?.applicationArchiveUrl || android?.artifacts?.buildUrl || android?.buildUrl || '';
          const iosUrl = ios?.buildUrl || ios?.artifacts?.buildUrl || '';
          const lines = [
            '# Atlas Office mobile build',
            '',
            `iOS EAS build: ${iosUrl || ios.id || 'completed'}`,
            'iOS submission: sent to TestFlight',
            `Android install: ${androidUrl || android.id || 'see EAS build page'}`,
          ];
          fs.writeFileSync('mobile-build-links.txt', lines.join('\n') + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          console.log(lines.join('\n'));
          NODE

      - name: Upload build links
        uses: actions/upload-artifact@v4
        with:
          name: atlas-mobile-build-links
          path: mobile-build-links.txt
