name: Recover Atlas iOS Icon

on:
  push:
    branches:
      - integration/mobile-event-editor-aligned-20260809
    paths:
      - ".github/workflows/tmp-recover-ios-icon.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/mobile-event-editor-aligned-20260809
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download last successful 0.1.6 IPA
        run: |
          curl -fL 'https://expo.dev/artifacts/eas/8nKMNrpSH1bdrVsSFhA_2Bn9gBcjhbvjI96mwgCc4kQ.ipa' -o /tmp/atlas.ipa
          rm -rf /tmp/atlas-ipa && mkdir -p /tmp/atlas-ipa
          unzip -q /tmp/atlas.ipa -d /tmp/atlas-ipa
          find /tmp/atlas-ipa/Payload -maxdepth 2 -type f -name 'AppIcon*.png' -print
      - name: Recover exact compiled Atlas app icon
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          candidates=[]
          for app in Path('/tmp/atlas-ipa/Payload').glob('*.app'):
              for p in app.glob('AppIcon*.png'):
                  try:
                      with Image.open(p) as im:
                          im.load()
                          w,h=im.size
                          if w==h:
                              candidates.append((w,p))
                  except Exception:
                      pass
          if not candidates:
              raise SystemExit('No readable AppIcon*.png found in successful Atlas IPA')
          candidates.sort(key=lambda x:x[0], reverse=True)
          size, source=candidates[0]
          print('Selected Atlas system app icon:', source, size)
          with Image.open(source) as src:
              img=src.convert('RGB').resize((1024,1024), Image.Resampling.LANCZOS)
              img.save('assets/atlas-one-app-icon.png', 'PNG', optimize=False, compress_level=6)
          with Image.open('assets/atlas-one-app-icon.png') as check:
              check.verify()
          print('Recovered exact Atlas icon as valid 1024x1024 PNG')
          PY
          file assets/atlas-one-app-icon.png
      - name: Commit recovered Atlas icon
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/atlas-one-app-icon.png
          if git diff --cached --quiet; then
            echo 'Recovered Atlas icon is already current'
          else
            git commit -m 'Recover exact Atlas app icon from successful iOS build'
            git push origin HEAD:integration/mobile-event-editor-aligned-20260809
          fi
