name: ValueCard iOS Rebuild

on:
  push:
    branches:
      - integration/mobile-event-editor-aligned-20260809
    paths:
      - ".github/workflows/tmp-valuecard-ios-rebuild.yml"

permissions:
  contents: write

jobs:
  eas-ios-build:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: integration/mobile-event-editor-aligned-20260809
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore real app icon
        run: |
          node -e 'const fs=require("fs"); let s=fs.readFileSync("assets/atlas-one-app-icon.png.base64","utf8").trim(); s=s.replace(/^data:image\/png;base64,/, "").replace(/[^A-Za-z0-9+/=]/g, ""); fs.writeFileSync("assets/atlas-one-app-icon.png", Buffer.from(s,"base64"));'
          file assets/atlas-one-app-icon.png
          test -s assets/atlas-one-app-icon.png

      - name: Commit app icon
        shell: bash
        run: |
          if git diff --quiet -- assets/atlas-one-app-icon.png && git ls-files --error-unmatch assets/atlas-one-app-icon.png >/dev/null 2>&1; then
            echo "App icon already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/atlas-one-app-icon.png
            git commit -m "Restore Atlas mobile app icon"
            git push origin HEAD:integration/mobile-event-editor-aligned-20260809
          fi

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Verify dependency tree
        run: npm ls react react-dom expo expo-router

      - name: Expo doctor
        run: npx expo-doctor

      - name: TypeScript check
        run: npm run typecheck

      - name: iOS prebuild smoke test
        run: npx expo prebuild --no-install --platform ios --clean

      - name: Verify Expo token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is unavailable in the Production environment."
            exit 2
          fi
          echo "EXPO_TOKEN is configured."

      - name: Verify EAS project binding
        run: npx eas-cli@latest project:info

      - name: Start internal iOS build
        run: npx eas-cli@latest build --platform ios --profile preview --non-interactive --no-wait
