name: ValueCard iOS Rebuild

on:
  push:
    branches:
      - integration/mobile-event-editor-aligned-20260809
    paths:
      - ".github/workflows/tmp-valuecard-ios-rebuild.yml"

permissions:
  contents: write

jobs:
  eas-ios-build:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: integration/mobile-event-editor-aligned-20260809
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore valid Atlas app icon from history
        shell: bash
        run: |
          git show 91a56b8299b54d5f621150fff810652e98bb863f:mobile/assets/atlas-one-app-icon.png.base64 > /tmp/atlas-icon-valid.b64
          node -e 'const fs=require("fs"); const s=fs.readFileSync("/tmp/atlas-icon-valid.b64","utf8").replace(/\s+/g,""); fs.writeFileSync("/tmp/atlas-icon-source.png", Buffer.from(s,"base64"));'
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          src = Image.open('/tmp/atlas-icon-source.png')
          src.load()
          img = src.convert('RGBA')
          if img.size != (1024, 1024):
              img = img.resize((1024, 1024), Image.Resampling.LANCZOS)
          img.save('assets/atlas-one-app-icon.png', format='PNG', optimize=False, compress_level=6)
          check = Image.open('assets/atlas-one-app-icon.png')
          check.verify()
          print('Restored valid Atlas icon:', img.size, img.mode)
          PY
          file assets/atlas-one-app-icon.png
          test -s assets/atlas-one-app-icon.png

      - name: Commit valid app icon
        shell: bash
        run: |
          if git diff --quiet -- assets/atlas-one-app-icon.png; then
            echo "Valid app icon already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/atlas-one-app-icon.png
            git commit -m "Restore valid Atlas mobile app icon"
            git push origin HEAD:integration/mobile-event-editor-aligned-20260809
          fi

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Verify dependency tree
        run: npm ls react react-dom expo expo-router

      - name: Expo doctor
        run: npx expo-doctor

      - name: TypeScript check
        run: npm run typecheck

      - name: iOS prebuild smoke test
        run: npx expo prebuild --no-install --platform ios --clean

      - name: Verify Expo token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is unavailable in the Production environment."
            exit 2
          fi
          echo "EXPO_TOKEN is configured."

      - name: Verify EAS project binding
        run: npx eas-cli@latest project:info

      - name: Start internal iOS build
        run: npx eas-cli@latest build --platform ios --profile preview --non-interactive --no-wait
