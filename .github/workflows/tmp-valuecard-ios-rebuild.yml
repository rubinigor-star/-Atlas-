name: ValueCard iOS Rebuild

on:
  push:
    branches:
      - integration/mobile-event-editor-aligned-20260809
    paths:
      - ".github/workflows/tmp-valuecard-ios-rebuild.yml"

jobs:
  eas-ios-build:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: integration/mobile-event-editor-aligned-20260809

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Inspect failed EAS build
        run: npx eas-cli@latest build:view 32243094-9e8a-4532-a1b0-081ca808f135 --json
