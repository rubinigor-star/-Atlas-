name: ValueCard iOS Rebuild

on:
  push:
    branches:
      - integration/mobile-event-editor-aligned-20260809
    paths:
      - ".github/workflows/tmp-valuecard-ios-rebuild.yml"

jobs:
  eas-ios-build:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: integration/mobile-event-editor-aligned-20260809

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Decode failed EAS build log
        shell: bash
        run: |
          npx eas-cli@latest build:view 32243094-9e8a-4532-a1b0-081ca808f135 --json > /tmp/eas-build.json
          LOG_URL=$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/eas-build.json","utf8")); process.stdout.write(x.logFiles?.[0]||"")')
          curl --compressed -fsSL "$LOG_URL" -o /tmp/eas-build.log
          echo "===== FILE TYPE ====="
          file /tmp/eas-build.log
          echo "===== RELEVANT LINES ====="
          strings /tmp/eas-build.log | grep -iE 'prebuild|error|failed|exception|expo|npm|ios|plugin|cannot|could not' | tail -n 180 || true
          echo "===== LOG TAIL ====="
          strings /tmp/eas-build.log | tail -n 120
