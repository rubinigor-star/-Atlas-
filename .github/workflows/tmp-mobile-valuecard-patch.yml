name: Temporary Mobile ValueCard Patch

on:
  push:
    branches:
      - fix/mobile-valuecard-badge-20260814

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-valuecard-badge-20260814
          fetch-depth: 0

      - name: Patch ValueCard badge into mobile request cards
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mobile/components/EventOperationsScreen.tsx')
          text = path.read_text()

          if '  Image,\n' not in text:
              anchor = '  FlatList,\n  Linking,'
              if anchor not in text:
                  raise SystemExit('Image import anchor not found')
              text = text.replace(anchor, '  FlatList,\n  Image,\n  Linking,', 1)

          if 'type ValueCardOrder' not in text:
              anchor = 'type CityOrder = EventOperationOrder & { customerCity?: string | null };\n'
              if anchor not in text:
                  raise SystemExit('ValueCard type anchor not found')
              text = text.replace(anchor, anchor + 'type ValueCardOrder = EventOperationOrder & { valueCardMember?: boolean };\n', 1)

          if 'function hasValueCardMembership' not in text:
              anchor = '  return city || null;\n}\n\nfunction customerAvatarIcon'
              replacement = '  return city || null;\n}\n\nfunction hasValueCardMembership(order: EventOperationOrder | null) {\n  return Boolean(order && (order as ValueCardOrder).valueCardMember);\n}\n\nfunction customerAvatarIcon'
              if anchor not in text:
                  raise SystemExit('ValueCard helper anchor not found')
              text = text.replace(anchor, replacement, 1)

          if 'accessibilityLabel="ValueCard member"' not in text:
              anchor = '<Text style={styles.customerName} numberOfLines={1}>{order.customerName}</Text>'
              replacement = anchor + '\n                    {hasValueCardMembership(order) && <Image source={{ uri: "https://www.atlas-one.co/branding/valuecard-mark.png" }} style={styles.valueCardMark} accessibilityLabel="ValueCard member" />}'
              if anchor not in text:
                  raise SystemExit('Customer name anchor not found')
              text = text.replace(anchor, replacement, 1)

          if 'valueCardMark:' not in text:
              anchor = '  customerName: { maxWidth: "78%", fontSize: 15, fontWeight: "900", color: "#17213C" },\n'
              if anchor not in text:
                  raise SystemExit('ValueCard style anchor not found')
              text = text.replace(anchor, anchor + '  valueCardMark: { width: 18, height: 18, resizeMode: "contain" },\n', 1)

          path.write_text(text)
          PY

      - name: Commit patch when changed
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/components/EventOperationsScreen.tsx
          git commit -m "Show ValueCard mark in mobile requests"
          git push origin HEAD:fix/mobile-valuecard-badge-20260814
